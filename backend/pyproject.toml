[tool.poetry]
name = "cronos-backend"
version = "0.1.0"
description = "Cronos FastAPI backend"
authors = ["Cronos Team <dev@cronos.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pydantic = {version = "^2.7.0", extras = ["email"]}
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
pyjwt = "^2.8.0"
bcrypt = "^4.1.3"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
